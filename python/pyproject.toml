[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-gateway-client"
version = "0.1.0"
description = "Typed Python client and bounded local parsers for OCR Gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Alvaro Villalba"}]
keywords = ["ocr", "pdf", "documents", "gateway"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
images = ["Pillow>=10"]
local = ["PyMuPDF>=1.24", "Pillow>=10"]

[project.urls]
Repository = "https://github.com/alvarovillalbaa/ocr-gateway"

[project.scripts]
ocr-gateway-local = "ocr_gateway.local:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ocr_gateway*"]

[tool.setuptools.package-data]
ocr_gateway = ["py.typed"]
